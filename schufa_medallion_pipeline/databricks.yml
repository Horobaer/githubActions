# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
# Dev Branch Test
bundle:
  name: "schufa_medallion_pipeline"

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog_name:
    description: "Catalog for pipeline output and dashboard datasets (overridden per target)."
    default: dev
  warehouse_id:
    description: "SQL warehouse used by the deployed dashboards."
    default: 3f547abcd8cd0867
  env_label:
    description: "Environment label used for resource tags (matches the governed 'env' tag values: DEV, TEST, PROD)."
    default: DEV

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-7fe5461a-79e4.cloud.databricks.com
    variables:
      catalog_name: dev
      env_label: DEV

  # The 'test' target: the incumbent pipeline already publishes to test.schufa_mock,
  # so deploying this target requires adopting/rebuilding those tables first.
  test:
    mode: production
    workspace:
      host: https://dbc-7fe5461a-79e4.cloud.databricks.com
    variables:
      catalog_name: test
      env_label: TEST

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-7fe5461a-79e4.cloud.databricks.com
      # We always use /Users/horobaer@gmail.com for all resources to make sure we only have a single copy.
      root_path: /Users/horobaer@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: prod
      env_label: PROD
    run_as:
      # This runs as horobaer@gmail.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: horobaer@gmail.com
