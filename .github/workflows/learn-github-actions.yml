
name: learn-github-actions
run-name: ${{ github.actor }} is learning GitHub Actions
# Deploy dev/test targets from their branches and prod from main.
on:
  push:
    branches:
      - main
      - dev
      - test
jobs:
  # A job groups steps that run together on the same runner.
  check-bats-version:
    # GitHub provides a fresh Ubuntu virtual machine for this job.
    runs-on: ubuntu-latest
    # Databricks auth shared by all steps of this job.
    env:
      # Repository variable containing the Databricks workspace URL.
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      # GitHub secrets protect the service-principal credentials.
      DATABRICKS_CLIENT_ID: ${{ secrets.CLIENT_ID_FIRSTSERVICEPRINCIPAL }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DBX_SECRET_FIRSTSERVICEPRINCIPAL }}
    steps:
      # Download the repository so subsequent steps can use its files.
      - uses: actions/checkout@v6
      # Install Node.js, which is needed for Node-based tools.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Install Bats, the Bash Automated Testing System.
      - run: npm install -g bats
      # Print the Bats version to confirm that it is installed.
      - run: bats -v
      # Install the Databricks CLI so Databricks commands are available.
      - uses: databricks/setup-cli@main
      - name: Update Databricks repo
        # Keep the Databricks repo aligned with the source branch.
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "Missing GitHub Actions repository variable: DATABRICKS_HOST"
            exit 1
          fi
          if [ -z "$DATABRICKS_CLIENT_ID" ]; then
            echo "Missing GitHub Actions secret: CLIENT_ID_FIRSTSERVICEPRINCIPAL"
            exit 1
          fi
          if [ -z "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "Missing GitHub Actions secret: DBX_SECRET_FIRSTSERVICEPRINCIPAL"
            exit 1
          fi
          databricks repos update /Workspace/githubActions --branch "$GITHUB_REF_NAME"
      - name: Deploy Databricks bundle
        working-directory: schufa_medallion_pipeline
        run: |
          case "$GITHUB_REF_NAME" in
            main) target=prod ;;
            dev|test) target="$GITHUB_REF_NAME" ;;
            *)
              echo "Unsupported deployment branch: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          databricks bundle deploy -t "$target"

      # Credentials are validated in the "Update Databricks repo" step above;
      # if they are missing, that step fails and this one never runs.
      - name: Deliver addOneBronceEntry job
        # The CLI waits for completion by default and fails if the run fails.
        run: databricks jobs run-now 252738613689179

          